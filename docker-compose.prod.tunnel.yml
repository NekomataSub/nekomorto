services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nekomorto-cloudflared
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - nekomorto_internal
    logging:
      options:
        max-size: "10m"
        max-file: "5"
