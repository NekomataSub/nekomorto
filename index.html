    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" />
    <script>
      (() => {
        const pathname = window.location.pathname;
        if (pathname === "/dashboard" || pathname.startsWith("/dashboard/")) {
          return;
        }

        const publicScrollbarGutterClass = "public-scrollbar-gutter-stable";
        document.documentElement.classList.add(publicScrollbarGutterClass);

        const applyBodyClass = () => {
          if (!document.body) {
            return;
          }
          document.body.classList.add(publicScrollbarGutterClass);
        };

        applyBodyClass();
        if (!document.body) {
          document.addEventListener("DOMContentLoaded", applyBodyClass, { once: true });
        }
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/inter/InterLatin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" content="#9667e0" />
